name: Beta Release

on:
    push:
        tags:
            - '*-beta.*'
    repository_dispatch:
        types:
            - pack-beta-tag-created

permissions:
    contents: write

concurrency:
    group: enhancement-pack-beta-release
    cancel-in-progress: false

jobs:
    beta:
        runs-on: ubuntu-latest
        env:
            RELEASE_TAG: ${{ github.event.client_payload.tag || github.ref_name }}

        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.client_payload.tag || github.ref_name }}
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Verify beta tag source
              id: source
              run: |
                  if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
                    echo "Pack beta tags must use x.y.z-beta.N" >&2
                    exit 1
                  fi
                  git fetch origin dev:refs/remotes/origin/dev
                  source_sha="$(git rev-parse HEAD)"
                  if ! git merge-base --is-ancestor "$source_sha" refs/remotes/origin/dev; then
                    echo "Pack beta tag must point to a commit contained in origin/dev" >&2
                    exit 1
                  fi
                  echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: npm ci

            - name: Test source
              run: npm test

            - name: Prepare beta version
              run: |
                  node scripts/release-version.mjs prepare --version "$RELEASE_TAG"
                  node scripts/release-version.mjs verify --version "$RELEASE_TAG"

            - name: Build Pack beta
              run: |
                  npm run build
                  node scripts/release-version.mjs verify --version "$RELEASE_TAG"
                  sha256sum main.js manifest.json styles.css > SHA256SUMS.txt

            - name: Upload workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: zotflow-enhancement-pack-${{ env.RELEASE_TAG }}
                  path: |
                      main.js
                      manifest.json
                      styles.css
                      SHA256SUMS.txt
                  if-no-files-found: error
                  compression-level: 0

            - name: Create Pack beta release
              env:
                  GH_TOKEN: ${{ github.token }}
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
                  ZOTFLOW_REF: ${{ github.event.client_payload.zotflowCommit }}
                  ZOTFLOW_VERSION: ${{ github.event.client_payload.zotflowVersion }}
                  CONTRACT_FINGERPRINT: ${{ github.event.client_payload.contractFingerprint }}
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "Release $RELEASE_TAG already exists; keeping it for an idempotent rerun"
                    exit 0
                  fi
                  notes="$(printf '%s\n\n%s\n%s\n%s' \
                    "Enhancement Pack beta built from commit \`$SOURCE_SHA\`." \
                    "ZotFlow: \`${ZOTFLOW_VERSION:-manual}\` at \`${ZOTFLOW_REF:-manual}\`." \
                    "Contract: \`${CONTRACT_FINGERPRINT:-manual}\`." \
                    "Validated with \`npm test\` and \`npm run build\`.")"
                  gh release create "$RELEASE_TAG" \
                    --verify-tag \
                    --title "$RELEASE_TAG" \
                    --notes "$notes" \
                    --prerelease \
                    --latest=false \
                    main.js \
                    manifest.json \
                    styles.css \
                    SHA256SUMS.txt
