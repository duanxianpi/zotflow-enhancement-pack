name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'
    repository_dispatch:
        types:
            - pack-stable-tag-created

concurrency:
    group: enhancement-pack-stable-release
    cancel-in-progress: false

jobs:
    build:
        if: ${{ !contains(github.event.client_payload.tag || github.ref_name, '-') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        env:
            RELEASE_TAG: ${{ github.event.client_payload.tag || github.ref_name }}

        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.client_payload.tag || github.ref_name }}
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Resolve and verify release version
              run: |
                  if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Stable Pack tags must use x.y.z" >&2
                    exit 1
                  fi
                  git fetch origin dev:refs/remotes/origin/dev
                  if ! git merge-base --is-ancestor HEAD refs/remotes/origin/dev; then
                    echo "Stable Pack tag must point to a commit contained in origin/dev" >&2
                    exit 1
                  fi

                  package_version="$(node -p "require('./package.json').version")"
                  manifest_version="$(node -p "require('./manifest.json').version")"
                  pack_version="$(node -p "require('./document-worker.lock.json').packVersion")"
                  versions_min_app="$(node -p "require('./versions.json')[process.argv[1]] || ''" "$manifest_version")"
                  if [ "$RELEASE_TAG" != "$package_version" ] || \
                     [ "$RELEASE_TAG" != "$manifest_version" ] || \
                     [ "$RELEASE_TAG" != "$pack_version" ] || \
                     [ -z "$versions_min_app" ]; then
                    echo "Tag, package, manifest, Pack lock, and versions.json must agree" >&2
                    exit 1
                  fi

            - name: Build plugin
              run: |
                  npm ci
                  npm run build
                  npm run lint

            - name: Upload workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: zotflow-enhancement-pack-${{ env.RELEASE_TAG }}
                  path: |
                      main.js
                      manifest.json
                      styles.css
                  if-no-files-found: error
                  compression-level: 0

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create draft release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "Release $RELEASE_TAG already exists; keeping it for an idempotent rerun"
                    exit 0
                  fi
                  gh release create "$RELEASE_TAG" \
                    --verify-tag \
                    --title "$RELEASE_TAG" \
                    --notes "Stable Enhancement Pack candidate built from \`$GITHUB_SHA\`." \
                    --draft \
                    main.js \
                    manifest.json \
                    styles.css
